name: Build Cinema OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run automated tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build the app
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Name the install file
        run: cp app/build/outputs/apk/release/app-release.apk cinema-os.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cinema-os
          path: cinema-os.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest cinema-os.apk \
            --title "Cinema OS build ${{ github.run_number }}" \
            --notes "Install on the TV with Downloader, or use Settings → Update app inside Cinema OS."
